<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <!-- إعدادات الشاشة للهواتف (Mobile-First) ومنع التكبير العشوائي -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>goldenChat</title>

    <!-- Tailwind CSS للتصميم السريع والأنيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- أيقونات Phosphor Icons (أيقونات عصرية وخفيفة) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- مكتبة Agora للمكالمات الصوتية والمرئية -->
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

    <!-- تخصيص الألوان (Golden Theme) والخطوط -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706' },
                        dark: { 800: '#1F2937', 900: '#111827' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #111827; color: white; overflow: hidden; }
        
        /* إخفاء شريط التمرير لجمالية التطبيق */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #F59E0B; border-radius: 10px; }
        
        .glass-panel { background: rgba(31, 41, 55, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(245, 158, 11, 0.2); }
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center">

    <!-- شريط تنبيه انقطاع الإنترنت -->
    <div id="offline-bar" class="hidden fixed top-0 w-full bg-red-600 text-white text-center py-1 text-sm z-50 transition-all">
        <span data-i18n="offline_msg">لا يوجد اتصال بالإنترنت. جاري المحاولة...</span>
    </div>

    <!-- تأثير صوتي للإشعارات (يمكنك تغييره لاحقاً برابط ملف mp3) -->
    <audio id="notification-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <!-- ========================================== -->
    <!-- 1. شاشة اختيار اللغة الابتدائية -->
    <!-- ========================================== -->
    <div id="lang-view" class="flex flex-col items-center justify-center w-full h-full p-6 animate-fade-in">
        <i class="ph-fill ph-crown text-gold-500 text-7xl mb-4"></i>
        <h1 class="text-3xl font-bold text-gold-400 mb-8">goldenChat</h1>
        <div class="space-y-4 w-full max-w-xs">
            <button onclick="setLanguage('ar')" class="w-full bg-dark-800 border border-gold-500 text-gold-400 p-3 rounded-xl hover:bg-gold-500 hover:text-dark-900 transition font-bold">العربية</button>
            <button onclick="setLanguage('en')" class="w-full bg-dark-800 border border-gold-500 text-gold-400 p-3 rounded-xl hover:bg-gold-500 hover:text-dark-900 transition font-bold">English</button>
            <button onclick="setLanguage('fr')" class="w-full bg-dark-800 border border-gold-500 text-gold-400 p-3 rounded-xl hover:bg-gold-500 hover:text-dark-900 transition font-bold">Français</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. شاشة المصادقة (Auth View) - خطوتين -->
    <!-- ========================================== -->
    <div id="auth-view" class="hidden-view flex flex-col items-center justify-center w-full h-full p-6 max-w-md w-full mx-auto">
        
        <!-- الخطوة 1: البريد ورقم الهاتف -->
        <div id="auth-step-1" class="w-full glass-panel p-6 rounded-2xl shadow-lg shadow-gold-500/20">
            <h2 class="text-2xl text-gold-400 font-bold mb-6 text-center" data-i18n="create_account">إنشاء حساب / دخول</h2>
            <input type="email" id="email-input" class="w-full bg-dark-900 border border-gray-700 p-3 rounded-lg mb-4 text-white focus:border-gold-500 outline-none" placeholder="البريد الإلكتروني" required>
            <input type="password" id="pass-input" class="w-full bg-dark-900 border border-gray-700 p-3 rounded-lg mb-4 text-white focus:border-gold-500 outline-none" placeholder="كلمة المرور" required>
            <!-- شرط رقم الهاتف الإجباري -->
            <input type="tel" id="phone-input" class="w-full bg-dark-900 border border-gold-500/50 p-3 rounded-lg mb-6 text-white focus:border-gold-500 outline-none" placeholder="رقم الهاتف (مع رمز الدولة +)" required oninput="checkAuthInputs()">
            
            <button id="send-otp-btn" onclick="requestOTP()" class="w-full bg-gold-500 text-dark-900 font-bold p-3 rounded-lg opacity-50 cursor-not-allowed transition" disabled data-i18n="send_code">
                إرسال رمز التحقق
            </button>
            <p id="auth-error-1" class="text-red-400 text-sm mt-3 text-center hidden"></p>
        </div>

        <!-- الخطوة 2: رمز التحقق (OTP) -->
        <div id="auth-step-2" class="hidden-view w-full glass-panel p-6 rounded-2xl shadow-lg shadow-gold-500/20">
            <h2 class="text-xl text-gold-400 font-bold mb-4 text-center" data-i18n="enter_otp">أدخل رمز التحقق</h2>
            <p class="text-sm text-gray-400 mb-6 text-center" data-i18n="otp_sent">تم إرسال الرمز إلى بريدك الإلكتروني مجاناً.</p>
            <input type="text" id="otp-input" class="w-full bg-dark-900 border border-gray-700 p-3 rounded-lg mb-6 text-white text-center text-2xl tracking-widest focus:border-gold-500 outline-none" placeholder="123456" maxlength="6">
            
            <button onclick="verifyOTP()" class="w-full bg-gold-500 text-dark-900 font-bold p-3 rounded-lg hover:bg-gold-400 transition" data-i18n="verify_btn">
                تأكيد ودخول
            </button>
            <p id="auth-error-2" class="text-red-400 text-sm mt-3 text-center hidden"></p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. شاشة التطبيق الرئيسية (Main App) -->
    <!-- ========================================== -->
    <div id="main-view" class="hidden-view flex flex-col w-full h-full bg-dark-900">
        
        <!-- الشريط العلوي (Header) -->
        <header class="bg-dark-800 p-4 flex justify-between items-center border-b border-gray-800 shadow-md">
            <div class="flex items-center gap-3">
                <i class="ph-fill ph-crown text-gold-500 text-3xl"></i>
                <h1 class="text-xl font-bold text-gold-400 tracking-wide">goldenChat</h1>
            </div>
            <div class="flex items-center gap-4">
                <!-- مؤشر الاتصال -->
                <div class="flex items-center gap-1 text-sm">
                    <span id="status-dot" class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]"></span>
                    <span id="status-text" class="text-gray-300" data-i18n="online">متصل</span>
                </div>
                <button onclick="logout()" class="text-gray-400 hover:text-red-400"><i class="ph ph-sign-out text-2xl"></i></button>
            </div>
        </header>

        <!-- منطقة القنوات (تظهر أولاً في الموبايل) -->
        <div id="channels-list" class="flex-1 overflow-y-auto p-4 space-y-2">
            <!-- سيتم حقن القنوات هنا عبر JS. القناة الرسمية ستكون مثبتة في الأعلى -->
            <div class="text-center text-gray-500 mt-10">
                <i class="ph ph-spinner animate-spin text-3xl"></i>
                <p class="mt-2" data-i18n="loading">جاري التحميل...</p>
            </div>
        </div>

        <!-- منطقة الدردشة (تظهر عند اختيار قناة) -->
        <div id="chat-area" class="hidden-view flex-1 flex flex-col h-full bg-dark-900 relative">
            <div class="bg-dark-800 p-3 flex justify-between items-center border-b border-gray-800">
                <button onclick="closeChat()" class="text-gold-500"><i class="ph ph-arrow-right text-2xl"></i></button>
                <h2 id="current-chat-title" class="font-bold text-white flex items-center gap-2">
                    <!-- اسم القناة يظهر هنا -->
                </h2>
                <div class="flex gap-3">
                    <button onclick="initiateCall('audio')" class="text-gold-500 hover:text-white"><i class="ph-fill ph-phone-call text-2xl"></i></button>
                    <button onclick="initiateCall('video')" class="text-gold-500 hover:text-white"><i class="ph-fill ph-video-camera text-2xl"></i></button>
                </div>
            </div>
            
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 pb-20">
                <!-- الرسائل تحقن هنا -->
            </div>

            <!-- مربع إرسال الرسائل -->
            <div class="absolute bottom-0 w-full bg-dark-800 p-3 border-t border-gray-700 flex items-center gap-2">
                <input type="file" id="media-input" accept="image/*,video/*" class="hidden" onchange="handleMediaUpload(event)">
                <button onclick="document.getElementById('media-input').click()" class="text-gray-400 hover:text-gold-500 transition">
                    <i class="ph ph-paperclip text-2xl"></i>
                </button>
                <input type="text" id="msg-input" class="flex-1 bg-dark-900 text-white rounded-full px-4 py-2 outline-none border border-gray-700 focus:border-gold-500" placeholder="اكتب رسالة...">
                <button onclick="sendMessage()" class="bg-gold-500 text-dark-900 p-2 rounded-full w-10 h-10 flex items-center justify-center hover:bg-gold-400">
                    <i class="ph-fill ph-paper-plane-tilt"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 4. شاشة المكالمات (Agora UI) -->
    <!-- ========================================== -->
    <div id="call-view" class="hidden-view fixed inset-0 bg-dark-900 z-50 flex flex-col">
        <div id="remote-video-container" class="flex-1 bg-black relative flex items-center justify-center">
            <p class="text-gray-500 text-center" data-i18n="waiting_others">في انتظار انضمام الطرف الآخر...</p>
        </div>
        <div id="local-video-container" class="absolute top-4 right-4 w-32 h-48 bg-dark-800 rounded-xl overflow-hidden border-2 border-gold-500 shadow-lg"></div>
        
        <div class="bg-dark-800 p-6 flex justify-center gap-8 border-t border-gray-800 rounded-t-3xl pb-10">
            <button onclick="toggleMic()" id="mic-btn" class="w-14 h-14 bg-gray-700 rounded-full flex items-center justify-center text-white text-2xl hover:bg-gray-600"><i class="ph-fill ph-microphone"></i></button>
            <button onclick="endCall()" class="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center text-white text-3xl hover:bg-red-500 shadow-[0_0_15px_#dc2626]"><i class="ph-fill ph-phone-disconnect"></i></button>
            <button onclick="toggleCamera()" id="cam-btn" class="w-14 h-14 bg-gray-700 rounded-full flex items-center justify-center text-white text-2xl hover:bg-gray-600"><i class="ph-fill ph-video-camera"></i></button>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- كود الجافاسكريبت (المنطق البرمجي) -->
    <!-- ========================================== -->
    <script>
        /* ---------------------------------------------------
           إعدادات المفاتيح (محفوظة مسبقاً)
        --------------------------------------------------- */
        const SUPABASE_URL = 'https://vfysgxgjahaojrtdagbj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_aRu1BBu5Pb29tq-fNYSZIA_PeSrrpoC';
        const AGORA_APP_ID = '51bbd33de1714538936e409f5f050768';
        const OFFICIAL_CHANNEL_ID = 'official-golden-chat'; // معرف القناة الرسمية

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // متغيرات عامة
        let currentUser = null;
        let currentLang = 'ar';
        let currentChannel = null;
        let agoraClient = null;
        let localTracks = { videoTrack: null, audioTrack: null };

        /* ---------------------------------------------------
           نظام اللغات (القاموس)
        --------------------------------------------------- */
        const dict = {
            ar: {
                create_account: "إنشاء حساب / دخول", send_code: "إرسال رمز التحقق",
                enter_otp: "أدخل رمز التحقق", otp_sent: "تم إرسال الرمز لبريدك.", verify_btn: "تأكيد ودخول",
                online: "متصل", offline_msg: "لا يوجد اتصال بالإنترنت. جاري المحاولة...", loading: "جاري التحميل...",
                official: "رسمي", type_msg: "اكتب رسالة...", waiting_others: "في انتظار انضمام الطرف الآخر...",
                vid_limit: "عذراً، مدة الفيديو يجب أن لا تتجاوز 3 دقائق لحفظ المساحة."
            },
            en: {
                create_account: "Login / Register", send_code: "Send OTP Code",
                enter_otp: "Enter OTP", otp_sent: "Code sent to your email.", verify_btn: "Verify & Enter",
                online: "Online", offline_msg: "No Internet Connection...", loading: "Loading...",
                official: "Official", type_msg: "Type a message...", waiting_others: "Waiting for others to join...",
                vid_limit: "Sorry, video duration cannot exceed 3 minutes."
            },
            fr: {
                create_account: "Connexion / Inscription", send_code: "Envoyer le code",
                enter_otp: "Entrez le code OTP", otp_sent: "Code envoyé à votre e-mail.", verify_btn: "Vérifier",
                online: "En ligne", offline_msg: "Pas de connexion Internet...", loading: "Chargement...",
                official: "Officiel", type_msg: "Écrivez un message...", waiting_others: "En attente des autres...",
                vid_limit: "Désolé, la vidéo ne peut pas dépasser 3 minutes."
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('html-root').dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(dict[lang][key]) el.innerText = dict[lang][key];
            });
            document.getElementById('msg-input').placeholder = dict[lang].type_msg;
            
            // إخفاء شاشة اللغة وإظهار التحقق من الجلسة
            switchView('lang-view', false);
            checkSession();
        }

        /* ---------------------------------------------------
           إدارة الشاشات (الواجهة)
        --------------------------------------------------- */
        function switchView(viewId, show) {
            document.getElementById(viewId).classList.toggle('hidden-view', !show);
        }

        /* ---------------------------------------------------
           المصادقة (Auth - خطوتين)
        --------------------------------------------------- */
        function checkAuthInputs() {
            const phone = document.getElementById('phone-input').value;
            const btn = document.getElementById('send-otp-btn');
            // إجبار المستخدم على إدخال الهاتف
            if(phone.length > 5) {
                btn.disabled = false; btn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btn.disabled = true; btn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        async function requestOTP() {
            const email = document.getElementById('email-input').value;
            const phone = document.getElementById('phone-input').value;
            const err = document.getElementById('auth-error-1');
            
            if(!email || !phone) return;
            
            // إرسال الرمز للبريد وحفظ الهاتف مؤقتاً
            const { data, error } = await supabase.auth.signInWithOtp({
                email: email,
                options: { data: { phone_number: phone } }
            });

            if(error) { err.innerText = error.message; err.classList.remove('hidden'); }
            else {
                switchView('auth-step-1', false);
                switchView('auth-step-2', true);
            }
        }

        async function verifyOTP() {
            const email = document.getElementById('email-input').value;
            const otp = document.getElementById('otp-input').value;
            const err = document.getElementById('auth-error-2');

            const { data: { session }, error } = await supabase.auth.verifyOtp({
                email: email, token: otp, type: 'email'
            });

            if (error) { err.innerText = "الرمز خاطئ!"; err.classList.remove('hidden'); }
            else if (session) {
                currentUser = session.user;
                await finalizeUserRegistration();
                loadMainApp();
            }
        }

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                loadMainApp();
            } else {
                switchView('auth-view', true);
                switchView('auth-step-1', true);
            }
        }

        // نقل الهاتف من البيانات المؤقتة لجدول profiles
        async function finalizeUserRegistration() {
            const phone = currentUser.user_metadata?.phone_number;
            if(phone) {
                await supabase.from('profiles').upsert({ id: currentUser.id, phone: phone });
            }
            await autoJoinOfficialChannel();
        }

        /* ---------------------------------------------------
           منطق القناة الرسمية والمحادثات
        --------------------------------------------------- */
        async function autoJoinOfficialChannel() {
            // الانضمام التلقائي للقناة الرسمية بدون تدخل المستخدم
            await supabase.from('channel_members').upsert(
                { user_id: currentUser.id, channel_id: OFFICIAL_CHANNEL_ID },
                { onConflict: 'user_id, channel_id' }
            );
        }

        async function loadMainApp() {
            switchView('auth-view', false);
            switchView('main-view', true);
            
            // جلب القنوات (تثبيت القناة الرسمية برمجياً)
            fetchChannels();
        }

        function renderChannelUI(id, name, isOfficial) {
            const list = document.getElementById('channels-list');
            const officialBadge = isOfficial ? `<span class="bg-gold-500 text-dark-900 text-xs px-2 py-1 rounded-full font-bold ml-2">📌 ${dict[currentLang].official}</span>` : '';
            const html = `
                <div onclick="openChat('${id}', '${name}')" class="flex items-center justify-between p-4 bg-dark-800 rounded-xl cursor-pointer hover:bg-gray-800 border-l-4 ${isOfficial ? 'border-gold-500' : 'border-transparent'}">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-full ${isOfficial ? 'bg-gold-500' : 'bg-gray-600'} flex items-center justify-center text-xl text-white">
                            ${isOfficial ? '<i class="ph-fill ph-crown"></i>' : '<i class="ph-fill ph-users"></i>'}
                        </div>
                        <div>
                            <h3 class="font-bold text-white">${name} ${officialBadge}</h3>
                            <p class="text-sm text-gray-400">اضغط لدخول المحادثة</p>
                        </div>
                    </div>
                </div>
            `;
            // القناة الرسمية دائماً في الأعلى
            isOfficial ? list.insertAdjacentHTML('afterbegin', html) : list.insertAdjacentHTML('beforeend', html);
        }

        // محاكاة جلب القنوات لتجربة الواجهة (سيتم استبدالها بجلب حقيقي من DB)
        function fetchChannels() {
            const list = document.getElementById('channels-list');
            list.innerHTML = ''; // تفريغ
            
            // القناة الرسمية (تُجبر دائماً)
            renderChannelUI(OFFICIAL_CHANNEL_ID, 'goldenChat Official', true);
            
            // قناة تجريبية
            renderChannelUI('demo-room-1', 'الغرفة العامة', false);
        }

        /* ---------------------------------------------------
           الدردشة والوسائط (فحص 3 دقائق)
        --------------------------------------------------- */
        function openChat(id, name) {
            currentChannel = id;
            document.getElementById('current-chat-title').innerHTML = name;
            switchView('channels-list', false);
            switchView('chat-area', true);
            // هنا يتم استدعاء الرسائل من قاعدة البيانات
        }

        function closeChat() {
            switchView('chat-area', false);
            switchView('channels-list', true);
            currentChannel = null;
        }

        function handleMediaUpload(event) {
            const file = event.target.files[0];
            if(!file) return;

            // خوارزمية فحص مدة الفيديو قبل الرفع
            if (file.type.startsWith('video/')) {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.onloadedmetadata = function() {
                    window.URL.revokeObjectURL(video.src);
                    const durationInMinutes = video.duration / 60;
                    if (durationInMinutes > 3) {
                        alert(dict[currentLang].vid_limit); // رفض الرفع
                        event.target.value = ''; // تفريغ الملف
                    } else {
                        // الملف صالح! يتم ضغطه ورفعه إلى Supabase Storage
                        uploadToSupabase(file);
                    }
                }
                video.src = URL.createObjectURL(file);
            } else {
                uploadToSupabase(file); // صورة
            }
        }

        async function uploadToSupabase(file) {
            // يتم رفع الملف هنا لـ Storage
            // ملاحظة هامة: الحذف التلقائي بعد 3 ساعات يتم إعداده في موقع Supabase 
            // عبر إنشاء (Storage Policy أو pg_cron) ولا يعتمد على كود الهاتف لضمان التنفيذ.
            console.log("جاري الرفع...", file.name);
            playSound();
        }

        /* ---------------------------------------------------
           المكالمات (Agora Integration)
        --------------------------------------------------- */
        async function initiateCall(type) {
            if(!currentChannel) return;
            switchView('call-view', true);
            
            agoraClient = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
            
            try {
                // للتبسيط في هذه المرحلة، نستخدم null للـ token
                await agoraClient.join(AGORA_APP_ID, currentChannel, null, currentUser?.id || Math.floor(Math.random()*1000));
                
                localTracks.audioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                if(type === 'video') {
                    localTracks.videoTrack = await AgoraRTC.createCameraVideoTrack();
                    localTracks.videoTrack.play("local-video-container");
                    await agoraClient.publish([localTracks.audioTrack, localTracks.videoTrack]);
                } else {
                    await agoraClient.publish([localTracks.audioTrack]);
                    document.getElementById('cam-btn').classList.add('hidden');
                }

                // استقبال مكالمة الطرف الآخر
                agoraClient.on("user-published", async (user, mediaType) => {
                    await agoraClient.subscribe(user, mediaType);
                    if (mediaType === "video") {
                        document.getElementById('remote-video-container').innerHTML = ''; // إزالة رسالة الانتظار
                        user.videoTrack.play("remote-video-container");
                    }
                    if (mediaType === "audio") user.audioTrack.play();
                });

            } catch (error) {
                console.error("خطأ في المكالمة:", error);
                endCall();
            }
        }

        function endCall() {
            if(localTracks.audioTrack) { localTracks.audioTrack.close(); localTracks.audioTrack = null; }
            if(localTracks.videoTrack) { localTracks.videoTrack.close(); localTracks.videoTrack = null; }
            if(agoraClient) agoraClient.leave();
            switchView('call-view', false);
        }

        /* ---------------------------------------------------
           تحسينات التجربة (UX)
        --------------------------------------------------- */
        function playSound() {
            document.getElementById('notification-sound').play().catch(e=>console.log("تم كتم الصوت افتراضياً"));
        }

        // مراقبة اتصال الإنترنت
        window.addEventListener('online', () => {
            document.getElementById('offline-bar').classList.add('hidden');
            document.getElementById('status-dot').classList.replace('bg-red-500', 'bg-green-500');
            document.getElementById('status-text').innerText = dict[currentLang].online;
        });
        window.addEventListener('offline', () => {
            document.getElementById('offline-bar').classList.remove('hidden');
            document.getElementById('status-dot').classList.replace('bg-green-500', 'bg-red-500');
            document.getElementById('status-text').innerText = "Offline";
        });
        
        async function logout() {
            await supabase.auth.signOut();
            window.location.reload();
        }
    </script>
</body>
