<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>goldenChat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706' },
                        dark: { 800: '#1F2937', 900: '#111827' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #111827; color: white; overflow: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #F59E0B; border-radius: 10px; }
        .glass-panel { background: rgba(31, 41, 55, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(245, 158, 11, 0.2); }
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center">

    <!-- 1. شاشة اختيار اللغة الابتدائية -->
    <div id="lang-view" class="flex flex-col items-center justify-center w-full h-full p-6">
        <i class="ph-fill ph-crown text-gold-500 text-7xl mb-4"></i>
        <h1 class="text-3xl font-bold text-gold-400 mb-8">goldenChat</h1>
        <div class="space-y-4 w-full max-w-xs">
            <button onclick="setLanguage('ar')" class="w-full bg-dark-800 border border-gold-500 text-gold-400 p-3 rounded-xl hover:bg-gold-500 hover:text-dark-900 transition font-bold">العربية</button>
            <button onclick="setLanguage('en')" class="w-full bg-dark-800 border border-gold-500 text-gold-400 p-3 rounded-xl hover:bg-gold-500 hover:text-dark-900 transition font-bold">English</button>
            <button onclick="setLanguage('fr')" class="w-full bg-dark-800 border border-gold-500 text-gold-400 p-3 rounded-xl hover:bg-gold-500 hover:text-dark-900 transition font-bold">Français</button>
        </div>
    </div>

    <!-- 2. شاشة المصادقة -->
    <div id="auth-view" class="hidden-view flex flex-col items-center justify-center w-full h-full p-6 max-w-md w-full mx-auto">
        <div class="w-full glass-panel p-6 rounded-2xl shadow-lg shadow-gold-500/20">
            <h2 class="text-2xl text-gold-400 font-bold mb-6 text-center">تسجيل الدخول</h2>
            <button onclick="goBackToLang()" class="w-full bg-gray-700 text-white p-2 rounded-lg mt-4">رجوع اختيار اللغة</button>
        </div>
    </div>

    <script>
        // إعدادات الاتصال الصحيحة والآمنة لمتصفح الهاتف
        const SUPABASE_URL = 'https://vfysgxgjahaojrtdagbj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_aRu1BBu5Pb29tq-fNYSZIA_PeSrrpoC';
        
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error("خطأ في تهيئة Supabase:", e);
        }

        function setLanguage(lang) {
            // اختبار تفاعل الأزرار وانتقال الشاشات فوراً
            document.getElementById('lang-view').classList.add('hidden-view');
            document.getElementById('auth-view').classList.remove('hidden-view');
        }

        function goBackToLang() {
            document.getElementById('auth-view').classList.add('hidden-view');
            document.getElementById('lang-view').classList.remove('hidden-view');
        }
    </script>
</body>
</html>
