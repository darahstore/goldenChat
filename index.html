<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>goldenChat</title>
    
    <!-- المكتبات الخارجية -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js" async></script>
    
    <!-- الثيم الأساسي -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706' },
                        dark: { 800: '#1F2937', 900: '#111827' }
                    }
                }
            }
        }
    </script>
    
    <!-- ربط ملف التصميم -->
    <link rel="stylesheet" href="styles.css">
    <style>
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col relative select-none bg-dark-900 text-white overflow-hidden">

    <!-- شريط انقطاع الشبكة -->
    <div id="offline-bar" class="hidden absolute top-0 left-0 w-full bg-red-600 text-white text-center py-2 font-bold z-[100] text-sm shadow-md transition-all">
        <i class="ph ph-wifi-x mr-2 text-lg"></i> <span id="offline-text">جاري إعادة الاتصال بالإنترنت...</span>
    </div>

    <!-- شاشة اختيار اللغة -->
    <div id="language-view" class="flex flex-col items-center justify-center w-full h-full p-6 absolute z-50 bg-dark-900">
        <i class="ph-fill ph-crown text-gold-500 text-7xl mb-4 animate-bounce"></i>
        <h1 class="text-4xl font-bold text-gold-400 mb-8 tracking-wide">goldenChat</h1>
        <div class="space-y-4 w-full max-w-xs">
            <button onclick="setLanguageAndProceed('ar')" class="w-full bg-dark-800 border border-gold-500 text-gold-400 p-3.5 rounded-xl hover:bg-gold-500 hover:text-dark-900 transition font-bold shadow-lg">العربية</button>
            <button onclick="setLanguageAndProceed('en')" class="w-full bg-dark-800 border border-gold-500 text-gold-400 p-3.5 rounded-xl hover:bg-gold-500 hover:text-dark-900 transition font-bold shadow-lg">English</button>
            <button onclick="setLanguageAndProceed('fr')" class="w-full bg-dark-800 border border-gold-500 text-gold-400 p-3.5 rounded-xl hover:bg-gold-500 hover:text-dark-900 transition font-bold shadow-lg">Français</button>
        </div>
    </div>

    <!-- شاشة المصادقة -->
    <div id="auth-view" class="hidden-view flex flex-col items-center justify-center w-full h-full p-6 max-w-md mx-auto absolute z-40 bg-dark-900">
        <div class="w-full glass-panel bg-dark-800 p-6 rounded-2xl shadow-xl border border-gray-700">
            <div class="flex justify-around border-b border-gray-700 mb-6 pb-2">
                <button id="tab-login-btn" class="tab-active text-gold-400 text-lg pb-2 transition-all font-bold border-b-2 border-gold-400">تسجيل الدخول</button>
                <button id="tab-signup-btn" class="tab-inactive text-gray-500 text-lg pb-2 transition-all">إنشاء حساب</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label id="lbl-email" class="block text-xs text-gray-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="email-input" placeholder="mail@example.com" class="w-full bg-dark-900 border border-gray-700 p-3 rounded-xl outline-none focus:border-gold-500 text-white" dir="ltr">
                </div>
                <div>
                    <label id="lbl-pass" class="block text-xs text-gray-400 mb-1">كلمة المرور</label>
                    <input type="password" id="password-input" placeholder="••••••••" class="w-full bg-dark-900 border border-gray-700 p-3 rounded-xl outline-none focus:border-gold-500 text-white" dir="ltr">
                </div>
                <div id="phone-field-wrapper" style="display: none;">
                    <label id="lbl-phone" class="block text-xs text-gray-400 mb-1">رقم الهاتف (إجباري مع رمز الدولة +)</label>
                    <input type="tel" id="phone-input" placeholder="+212600000000" class="w-full bg-dark-900 border border-gray-700 p-3 rounded-xl outline-none focus:border-gold-500 text-white" dir="ltr">
                </div>
                <button id="btn-submit-auth" disabled class="w-full bg-gray-600 text-gray-400 p-3.5 rounded-xl font-bold transition shadow-md cursor-not-allowed">متابعة</button>
            </div>
        </div>
    </div>

    <!-- شاشة التطبيق الرئيسية (المحادثة) -->
    <div id="main-chat-view" class="hidden-view flex flex-col w-full h-full absolute z-30 bg-dark-900">
        <header class="flex justify-between items-center p-4 bg-dark-800 border-b border-gray-700 shadow-md z-10">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-crown text-gold-500 text-2xl"></i>
                <span class="font-bold text-gold-400 text-lg">goldenChat</span>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 bg-dark-900 px-3 py-1 rounded-full border border-gray-700">
                    <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
                    <span id="user-status" class="text-xs text-gray-300 font-medium">متصل</span>
                </div>
                <button id="btn-call-audio" class="p-2 bg-dark-900 rounded-full text-gold-400 hover:bg-gold-500 hover:text-dark-900 transition"><i class="ph ph-phone text-lg"></i></button>
                <button id="btn-call-video" class="p-2 bg-dark-900 rounded-full text-gold-400 hover:bg-gold-500 hover:text-dark-900 transition"><i class="ph ph-video-camera text-lg"></i></button>
                <button onclick="toggleSettings()" class="p-2 bg-dark-900 rounded-full text-gray-300 hover:text-white transition"><i class="ph ph-gear text-lg"></i></button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 space-y-4 relative" id="chat-messages">
            <!-- الرسائل -->
        </main>

        <!-- تم تصحيح الفوتر ليناسب المساحة ولا يخفي زر الإرسال -->
        <footer class="p-2 bg-dark-800 border-t border-gray-700 flex items-center gap-1.5 w-full shrink-0 relative z-10">
            <div class="flex items-center gap-1 shrink-0">
                <label class="p-2 bg-dark-900 rounded-xl text-blue-400 cursor-pointer hover:bg-dark-700 transition border border-gray-700" title="صورة">
                    <i class="ph ph-image text-xl"></i>
                    <input type="file" id="upload-img" class="hidden" accept="image/*">
                </label>
                <label class="p-2 bg-dark-900 rounded-xl text-green-400 cursor-pointer hover:bg-dark-700 transition border border-gray-700" title="فيديو">
                    <i class="ph ph-video-camera text-xl"></i>
                    <input type="file" id="upload-vid" class="hidden" accept="video/*">
                </label>
                <label class="p-2 bg-dark-900 rounded-xl text-purple-400 cursor-pointer hover:bg-dark-700 transition border border-gray-700" title="صوت">
                    <i class="ph ph-microphone-stage text-xl"></i>
                    <input type="file" id="upload-aud" class="hidden" accept="audio/*">
                </label>
            </div>
            
            <input type="text" id="msg-input" placeholder="اكتب رسالة..." class="flex-1 min-w-0 bg-dark-900 border border-gray-700 p-2.5 rounded-xl outline-none focus:border-gold-500 text-white text-sm">
            
            <button id="btn-send" class="p-2.5 bg-gold-500 text-dark-900 rounded-xl font-bold hover:bg-gold-400 transition shadow-md shrink-0">
                <i class="ph-fill ph-paper-plane-right text-xl"></i>
            </button>
        </footer>
    </div>

    <!-- واجهة الاتصال -->
    <div id="call-container" class="hidden-view absolute inset-0 z-[60] bg-dark-900/95 flex flex-col items-center justify-center p-4 backdrop-blur-sm">
        <h2 class="text-gold-400 text-xl font-bold mb-4 animate-pulse">جاري الاتصال...</h2>
        <div id="video-streams" class="w-full max-w-3xl flex flex-wrap gap-4 justify-center mb-8"></div>
        <div class="flex gap-6 bg-dark-800 p-4 rounded-3xl border border-gray-700 shadow-xl">
            <button id="btn-toggle-mic" class="p-4 bg-gray-700 rounded-full text-white hover:bg-gray-600 transition"><i class="ph ph-microphone text-2xl"></i></button>
            <button id="btn-end-call" class="p-4 bg-red-600 rounded-full text-white hover:bg-red-500 transition shadow-lg"><i class="ph ph-phone-disconnect text-2xl"></i></button>
            <button id="btn-toggle-cam" class="p-4 bg-gray-700 rounded-full text-white hover:bg-gray-600 transition"><i class="ph ph-camera text-2xl"></i></button>
        </div>
    </div>

    <!-- شاشة الإعدادات -->
    <div id="settings-panel" class="fixed top-0 right-0 w-full max-w-sm h-full z-50 bg-dark-900 border-l border-gray-800 transform translate-x-full transition-transform duration-300 flex flex-col p-4 shadow-2xl">
        <header class="flex items-center mb-6 pb-4 border-b border-gray-800">
            <button onclick="closeSettings()" class="p-2 bg-dark-800 rounded-full text-white ml-3 hover:bg-gray-700 transition"><i class="ph ph-arrow-right text-lg"></i></button>
            <h2 id="settings-title" class="text-xl font-bold text-gold-400">الإعدادات</h2>
        </header>

        <div class="space-y-6 flex-1 overflow-y-auto">
            <div class="bg-dark-800 p-4 rounded-xl border border-gray-700">
                <label id="lbl-lang-select" class="block text-sm text-gray-400 mb-2">لغة التطبيق</label>
                <div class="relative">
                    <select id="global-lang-select" onchange="changeGlobalLanguage(this.value)" class="w-full bg-dark-900 border border-gray-600 text-white p-3 rounded-xl outline-none focus:border-gold-500 appearance-none">
                        <!-- يتم حقن اللغات هنا -->
                    </select>
                    <i class="ph ph-caret-down absolute top-4 left-4 text-gray-400 pointer-events-none"></i>
                </div>
            </div>

            <!-- تم إضافة قناتك الخاصة مثبتة في الأعلى -->
            <div class="bg-dark-800 p-4 rounded-xl border border-gray-700">
                <h3 id="lbl-my-groups" class="text-md text-white font-bold mb-3">مجموعاتي النشطة</h3>
                <div id="my-groups-list" class="space-y-2">
                    <div class="flex justify-between items-center bg-gold-500/10 p-3 rounded-lg border border-gold-500/30 cursor-pointer hover:bg-gold-500/20 transition">
                        <div class="flex items-center gap-2">
                            <i class="ph-fill ph-push-pin text-gold-500"></i>
                            <span id="lbl-my-channel" class="text-sm text-gold-400 font-bold">قناتي الخاصة</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center bg-dark-900 p-3 rounded-lg border border-gray-700 cursor-pointer hover:bg-dark-800 transition">
                        <div class="flex items-center gap-2">
                            <i class="ph ph-hash text-gray-400"></i>
                            <span id="lbl-general-chat" class="text-sm text-gray-300 font-bold">المحادثة العامة</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button id="btn-logout" class="w-full bg-red-600/10 border border-red-600 text-red-500 p-4 rounded-xl font-bold hover:bg-red-600 hover:text-white transition mt-4 mb-6">
            تسجيل الخروج
        </button>
    </div>

    <script src="app.js"></script>
</body>
                  </html>
